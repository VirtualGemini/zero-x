# 生产环境配置
spring:
  datasource:
    # PostgreSQL JDBC 驱动
    driver-class-name: org.postgresql.Driver
    # 生产数据库连接必须由部署环境提供，不设置弱默认值
    url: ${POSTGRESQL_DB_URL}
    # 生产数据库用户名必须由部署环境提供
    username: ${POSTGRESQL_DB_USERNAME}
    # 生产数据库密码必须由部署环境提供
    password: ${POSTGRESQL_DB_PASSWORD}
    hikari:
      # 数据源连接池名称
      pool-name: ZeroxHikariPool
      # 最小空闲连接数
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # 最大连接数
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      # 获取数据库连接的超时时间，单位毫秒
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}

# 生产环境默认关闭接口文档，需要时显式开启
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

# 生产环境跨域来源必须由部署环境明确指定
zero-x:
  cors:
    allowed-origin-patterns:
      - ${CORS_ALLOWED_ORIGIN}

# 生产环境降低框架日志噪声并写入指定目录
logging:
  level:
    root: WARN
    com.zerox: INFO
  file:
    path: ${LOG_PATH:/var/log/zerox}
