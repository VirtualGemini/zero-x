# 本地开发环境配置
spring:
  datasource:
    # PostgreSQL JDBC 驱动
    driver-class-name: org.postgresql.Driver
    # 本地数据库地址，可通过环境变量覆盖
    url: ${POSTGRESQL_DB_URL:jdbc:postgresql://localhost:5432/zerox}
    # 本地数据库用户名
    username: ${POSTGRESQL_DB_USERNAME:postgres}
    # 本地数据库密码
    password: ${POSTGRESQL_DB_PASSWORD:postgres}
    hikari:
      # 数据源连接池名称
      pool-name: ZeroxHikariPool
      # 最小空闲连接数
      minimum-idle: 2
      # 最大连接数
      maximum-pool-size: 10
      # 获取数据库连接的超时时间，单位毫秒
      connection-timeout: 30000
      # 连接有效性检查超时时间，单位毫秒
      validation-timeout: 5000
      # 数据库暂不可用时不阻断应用启动
      initialization-fail-timeout: -1

# 本地环境开放接口文档
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 本地前端跨域配置
zero-x:
  cors:
    allowed-origin-patterns:
      # 允许通过环境变量指定主要前端地址
      - ${CORS_ALLOWED_ORIGIN:http://localhost:*}
      # 同时允许使用 127.0.0.1 启动的前端服务
      - "http://127.0.0.1:*"

# 本地环境输出更详细的项目日志并写入工作目录
logging:
  level:
    com.zerox: DEBUG
  file:
    path: ./logs
